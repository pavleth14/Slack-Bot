#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        listen 80;
        server_name api.twobrothersfreight.com;

        location ^~ /.well-known/acme-challenge/ {
            root C:/nginx/html;
            default_type text/plain;
            allow all;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;

        server_name api.twobrothersfreight.com;

        # =========================
        # SSL CERTIFICATES (win-acme)
        # =========================
        ssl_certificate     C:/nginx/certs/api.twobrothersfreight.com-chain.pem;
        ssl_certificate_key C:/nginx/certs/api.twobrothersfreight.com-key.pem;

        # Security (safe defaults)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Increase upload limit
        client_max_body_size 50M;

        # =========================
        # SLACK BOT (Node on port 5002)
        # Slack URLs:
        #   POST /slack/commands/truckswitch
        #   POST /slack/interactions
        # Optional health: GET /slack-health
        # =========================
        location /slack/ {
            proxy_pass http://localhost:5002/slack/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location = /slack-health {
            proxy_pass http://localhost:5002/health;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =========================
        # API PROXY (Node/.NET/etc on port 5001)
        # =========================
        location / {
            proxy_pass http://localhost:5001;

            # Preserve client info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (safe to keep)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Optional timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
